career-profile:
  title: Career Profile
  summary: |
    Over 20 years of web developer experience, an expert in Data Sovereignty accompanying a background in soft skills and Indigenous systems thinking.
education:
  title: Education
  info:
  - degree: BA in Appllied Indigenous Law and Science
    university: MSU Denver
    time: 2023
    details: |
      The confluence of Environmental Science, Policy and Tech merged with the application of American Indian Tribal Sovereignty frameworks
        - Mapping
        - Data Sovereignty

experiences:
  title: Experiences
  info:
  - role: Program Coordinator
    time: 2025 - Present
    company: Indigenous Data Alliance
    details: |
      (1) Training Indigenous Data Warriors: Help organize leadership development, intergenerational learning opportunities, and community retreats; 

      (2) Producing Policy by and for Indigenous Peoples: Coordinate the creation and distribution of briefs, reports, and other resources that strengthen IDSov and IDGov;

      (3) Building Data and Infrastructure: Assist with internal systems and external capacity-building that enables Indigenous communities to design and govern their own data systems.
        - Non Profit Finance Adminstration
        - Project Mangement Software Deployment
  - role: Co-Director
    time: 2025 - Present
    company: WRISE Indigenous Peoples Chapter
    details: |
       lead Leadership Council meetings, lead direction and intention of the chapter, support all other committee members in their roles; coordinate with WRISE Nation when needed, liaise with the Advisory Council, serve as decision makers for WRISE Indigenous Peoples, serve as external point of contact for chapter. 
        - Branding & Web Presence
        - Governance Document Writing
  - role: Founder & CEO 
    time: 2024 - present
    company: Wawokiye, LLC
    details: |
      A collective of Indigenous professionals providing tailored consultation, marketing. research services for Tribes and serving small Native and minority owned businesses 
        - Executive Leadership
        - Entrepreneurship

